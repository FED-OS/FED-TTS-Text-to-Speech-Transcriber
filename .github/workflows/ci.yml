name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run ruff linter
        run: |
          ruff check . --output-format=github

      - name: Run ruff formatter check
        run: |
          ruff format --check .

  type-check:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run mypy
        run: |
          mypy src/fed_tts/

  format-check:
    name: Format Check (black)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install black
        run: |
          python -m pip install --upgrade pip
          pip install black

      - name: Run black format check
        run: |
          black --check --diff .

  import-check:
    name: Import Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Verify imports
        run: |
          python -c "import fed_tts; print(f'fed_tts version: {fed_tts.__version__}')"
          python -c "from fed_tts.grammar_checker import GrammarChecker; print('GrammarChecker imported')"
          python -c "from fed_tts.tts import get_tts_js; print('tts imported')"
          python -c "from fed_tts.transcriber import audio_to_data_uri; print('transcriber imported')"

  ci-summary:
    name: CI Summary
    runs-on: ubuntu-latest
    needs: [lint, type-check, format-check, import-check]
    if: always()
    steps:
      - name: Check CI status
        run: |
          echo "CI checks completed"
          for job in lint type-check format-check import-check; do
            result="${{ needs.${job}.result }}"
            echo "$job: $result"
            if [ "$result" != "success" ]; then
              echo "❌ $job failed"
              exit 1
            fi
          done
          echo "✅ All CI checks passed"
