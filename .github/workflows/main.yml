name: Main CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Quick checks that gate everything else
  pre-checks:
    name: Pre-Checks
    runs-on: ubuntu-latest
    outputs:
      should-run: ${{ steps.changes.outputs.src }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for source changes
        uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            src:
              - "app.py"
              - "src/**"
              - "tests/**"
              - "requirements*.txt"
              - "pyproject.toml"
              - "Dockerfile"

  # Lint and format
  quality:
    name: Code Quality
    needs: pre-checks
    if: needs.pre-checks.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - run: pip install ruff black mypy
      - run: ruff check .
      - run: ruff format --check .
      - run: black --check .

  # Test matrix
  test:
    name: Tests
    needs: [pre-checks, quality]
    if: needs.pre-checks.outputs.should-run == 'true'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: |
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .
      - run: pytest --verbose --cov=fed_tts

  # Build
  build:
    name: Build
    needs: [quality, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: |
          pip install build
          python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  # Final status check
  all-clear:
    name: All Checks Pass
    runs-on: ubuntu-latest
    needs: [quality, test, build]
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          echo "Quality: ${{ needs.quality.result }}"
          echo "Test: ${{ needs.test.result }}"
          echo "Build: ${{ needs.build.result }}"
          if [[ "${{ needs.quality.result }}" != "success" && "${{ needs.quality.result }}" != "skipped" ]]; then exit 1; fi
          if [[ "${{ needs.test.result }}" != "success" && "${{ needs.test.result }}" != "skipped" ]]; then exit 1; fi
          if [[ "${{ needs.build.result }}" != "success" && "${{ needs.build.result }}" != "skipped" ]]; then exit 1; fi
          echo "✅ All checks passed!"
