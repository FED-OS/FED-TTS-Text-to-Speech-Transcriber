name: Stale

on:
  schedule:
    - cron: "0 0 * * *"  # Run daily at midnight UTC
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    name: Mark Stale Issues and PRs
    runs-on: ubuntu-latest
    steps:
      - name: Mark stale issues and PRs
        uses: actions/stale@v9
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          
          # Issues configuration
          days-before-issue-stale: 60
          days-before-issue-close: 14
          stale-issue-label: "stale"
          exempt-issue-labels: "pinned,security,good first issue,help wanted,roadmap,in progress"
          stale-issue-message: |
            This issue has been automatically marked as stale because it has not had
            recent activity in the last 60 days. It will be closed in 14 days if no
            further activity occurs. Thank you for your contributions to FED TTS!
            
            To keep this issue open:
            - Add a comment with updates
            - Remove the `stale` label
            - Add a `pinned` label if this is important
            
          close-issue-message: |
            This issue has been automatically closed due to inactivity.
            If you believe this was closed in error, please reopen it or
            create a new issue with updated information. Thank you!
          
          # Pull requests configuration
          days-before-pr-stale: 30
          days-before-pr-close: 14
          stale-pr-label: "stale"
          exempt-pr-labels: "pinned,dependencies,security,WIP,do-not-stale"
          stale-pr-message: |
            This pull request has been automatically marked as stale because it has
            not had recent activity in the last 30 days. It will be closed in 14 days
            if no further activity occurs.
            
            To keep this PR open:
            - Push new commits
            - Add a comment with status update
            - Remove the `stale` label
            
          close-pr-message: |
            This pull request has been automatically closed due to inactivity.
            Feel free to reopen it or submit a new PR if you'd like to continue
            this work. Thank you for your contribution!
          
          # General configuration
          operations-per-run: 30
          ascending: true
          start-date: "2025-01-01"
