name: PR Checks

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  pr-validation:
    name: PR Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
          pip install -e .

      - name: Run all checks
        run: |
          echo "=== Ruff ==="
          ruff check . || true
          echo "=== Black ==="
          black --check . || true
          echo "=== Mypy ==="
          mypy src/fed_tts/ || true
          echo "=== Pytest ==="
          pytest --verbose --tb=short

      - name: Check PR title
        uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
          requireScope: false

      - name: Check for AI dependencies
        run: |
          echo "Checking for AI/ML dependencies in changed files..."
          CHANGED_FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files: $CHANGED_FILES"
          
          for file in $CHANGED_FILES; do
            if grep -iE "import (torch|tensorflow|transformers|openai|anthropic|langchain|llama)" "$file" 2>/dev/null; then
              echo "❌ AI/ML dependency found in $file"
              echo "FED TTS follows a strict No AI philosophy!"
              exit 1
            fi
          done
          echo "✅ No AI/ML dependencies found"

  size-check:
    name: PR Size Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check PR size
        run: |
          DIFF_LINES=$(git diff --stat origin/${{ github.base_ref }}...HEAD | tail -1 | awk '{print $4}')
          echo "PR adds $DIFF_LINES lines"
          if [ -z "$DIFF_LINES" ]; then
            DIFF_LINES=0
          fi
          if [ "$DIFF_LINES" -gt 500 ]; then
            echo "⚠️  Large PR detected ($DIFF_LINES insertions). Consider splitting into smaller PRs."
          else
            echo "✅ PR size is reasonable ($DIFF_LINES insertions)"
          fi
