name: Labeler

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  label:
    name: Label PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Label PR based on changed files
        uses: actions/labeler@v5
        with:
          configuration-path: .github/labeler.yml
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          sync-labels: true

      - name: Label based on PR size
        uses: pascalgn/size-label-action@v0.5.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          sizes: >
            {
              "0": "size/XS",
              "20": "size/S",
              "50": "size/M",
              "150": "size/L",
              "500": "size/XL"
            }

      - name: Label based on branch name
        uses: actions/github-script@v7
        with:
          script: |
            const branchName = context.payload.pull_request.head.ref.toLowerCase();
            const labels = [];
            
            if (branchName.startsWith('feature/') || branchName.startsWith('feat/')) {
              labels.push('enhancement');
            } else if (branchName.startsWith('bugfix/') || branchName.startsWith('fix/')) {
              labels.push('bug');
            } else if (branchName.startsWith('docs/')) {
              labels.push('documentation');
            } else if (branchName.startsWith('refactor/')) {
              labels.push('refactor');
            } else if (branchName.startsWith('test/')) {
              labels.push('testing');
            } else if (branchName.startsWith('ci/') || branchName.startsWith('chore/')) {
              labels.push('ci-cd');
            }
            
            if (labels.length > 0) {
              await github.rest.issues.addLabels({
                ...context.repo,
                issue_number: context.payload.pull_request.number,
                labels: labels
              });
              console.log(`Added labels: ${labels.join(', ')}`);
            }
