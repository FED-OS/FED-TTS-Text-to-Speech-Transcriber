name: Deploy

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "src/**"
      - "styles.css"
      - "requirements.txt"
      - "pyproject.toml"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy-streamlit-cloud:
    name: Deploy to Streamlit Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify deployment requirements
        run: |
          echo "Checking deployment files..."
          test -f app.py || { echo "❌ app.py not found"; exit 1; }
          test -f requirements.txt || { echo "❌ requirements.txt not found"; exit 1; }
          test -f styles.css || { echo "❌ styles.css not found"; exit 1; }
          echo "✅ All required files present"

      - name: Verify app imports
        run: |
          pip install -r requirements.txt
          pip install -e .
          python -c "import fed_tts; print(f'FED TTS v{fed_tts.__version__} ready for deployment')"

      - name: Deployment info
        run: |
          echo "========================================="
          echo "  FED TTS Deployment"
          echo "========================================="
          echo "Streamlit Cloud deployment is configured."
          echo "The app will be available at the URL"
          echo "configured in Streamlit Cloud settings."
          echo ""
          echo "To set up Streamlit Community Cloud:"
          echo "1. Go to https://share.streamlit.io"
          echo "2. Connect your GitHub repository"
          echo "3. Set main file path: app.py"
          echo "========================================="

  deploy-docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: fed-tts:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test Docker image
        run: |
          docker run --rm -d -p 8501:8501 --name fed-tts-test fed-tts:latest
          sleep 10
          if curl -s http://localhost:8501 | grep -q "Streamlit"; then
            echo "✅ Docker container is running"
          else
            echo "❌ Docker container failed to start"
            docker logs fed-tts-test
            exit 1
          fi
          docker stop fed-tts-test
