fail-on-severity: "moderate"

# Allow these licenses
allow-licenses:
  - MIT
  - Apache-2.0
  - BSD-2-Clause
  - BSD-3-Clause
  - ISC
  - MPL-2.0
  - Python-2.0
  - Unlicense

# Deny these licenses
deny-licenses:
  - GPL-3.0
  - AGPL-3.0

# Warn on these licenses
warn-licenses:
  - LGPL-2.1
  - LGPL-3.0
